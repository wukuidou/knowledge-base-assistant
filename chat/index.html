<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Knowledge Base Chat</title>
<style>
  :root {
    --bg: #f5f5f5;
    --card: #ffffff;
    --text: #1a1a1a;
    --sub: #888;
    --bubble-user: #e3f2fd;
    --bubble-ai: #ffffff;
    --border: #e0e0e0;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --source-bg: #f8f9fa;
  }
  .dark {
    --bg: #1a1a2e;
    --card: #16213e;
    --text: #e0e0e0;
    --sub: #999;
    --bubble-user: #1e3a5f;
    --bubble-ai: #16213e;
    --border: #2a2a4a;
    --accent: #60a5fa;
    --accent-hover: #93bbfd;
    --source-bg: #0f1b2d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  /* Header */
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header .actions { display: flex; gap: 8px; }
  header button {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
  }
  header button:hover { background: var(--border); }
  /* Chat area */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg {
    display: flex;
    flex-direction: column;
    max-width: 75%;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } }
  .msg.user { align-self: flex-end; }
  .msg.assistant { align-self: flex-start; }
  .msg .bubble {
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.6;
    font-size: 14px;
    word-wrap: break-word;
    border: 1px solid var(--border);
  }
  .msg.user .bubble { background: var(--bubble-user); border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--bubble-ai); border-bottom-left-radius: 4px; }
  .msg .meta { font-size: 11px; color: var(--sub); margin-top: 4px; padding: 0 8px; }
  .msg.user .meta { text-align: right; }
  /* Sources */
  .sources {
    margin-top: 8px;
    background: var(--source-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .sources summary {
    padding: 8px 12px;
    font-size: 12px;
    color: var(--accent);
    cursor: pointer;
    user-select: none;
  }
  .sources .src {
    padding: 8px 12px;
    font-size: 12px;
    color: var(--sub);
    border-top: 1px solid var(--border);
    max-height: 100px;
    overflow-y: auto;
    white-space: pre-wrap;
    font-family: monospace;
  }
  /* Input area */
  footer {
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    flex-shrink: 0;
  }
  #input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  #input-row textarea {
    flex: 1;
    resize: none;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    outline: none;
    min-height: 42px;
    max-height: 120px;
    line-height: 1.4;
  }
  #input-row textarea:focus { border-color: var(--accent); }
  #send-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
    height: 42px;
  }
  #send-btn:hover { background: var(--accent-hover); }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  /* Loading dots */
  .dot-pulse { display: flex; gap: 4px; padding: 4px 0; }
  .dot-pulse span {
    width: 6px; height: 6px;
    background: var(--sub);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
  .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }
  /* Status bar */
  #status {
    font-size: 11px;
    color: var(--sub);
    padding: 4px 0;
    text-align: center;
  }
  /* Upload panel */
  #upload-toggle {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    width: 30px;
    height: 30px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    opacity: 0.6;
  }
  #upload-toggle:hover { opacity: 1; background: var(--border); }
  #upload-toggle.active { opacity: 1; background: var(--accent); color: #fff; border-color: var(--accent); }
  #upload-panel {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    margin: 0 20px 12px 20px;
    flex-shrink: 0;
    animation: fadeIn 0.2s ease;
  }
  #upload-panel.show { display: block; }
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 24px;
    text-align: center;
    color: var(--sub);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    background: var(--source-bg);
    color: var(--accent);
  }
  .drop-zone .icon { font-size: 28px; display: block; margin-bottom: 4px; }
  .drop-zone .hint { font-size: 11px; opacity: 0.6; margin-top: 4px; }
  #file-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
    max-height: 120px;
    overflow-y: auto;
  }
  .file-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--source-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    color: var(--text);
  }
  .file-tag .name { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-tag .size { color: var(--sub); font-size: 10px; }
  .file-tag .remove {
    cursor: pointer;
    color: var(--sub);
    font-size: 14px;
    line-height: 1;
    padding: 0 2px;
    border-radius: 3px;
  }
  .file-tag .remove:hover { color: #ef4444; background: #fee2e2; }
  .upload-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 10px;
  }
  .upload-actions button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 6px 16px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .upload-actions button:hover { background: var(--accent-hover); }
  .upload-actions button:disabled { opacity: 0.5; cursor: not-allowed; }
  .upload-status {
    font-size: 12px;
    color: var(--sub);
  }
  .upload-status.error { color: #ef4444; }
  .upload-status.success { color: #22c55e; }
  #doc-list {
    margin-top: 10px;
    max-height: 100px;
    overflow-y: auto;
  }
  .doc-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 3px 0;
    font-size: 12px;
    color: var(--sub);
  }
  .doc-row .del-doc {
    background: none;
    border: none;
    color: var(--sub);
    cursor: pointer;
    font-size: 14px;
    padding: 0 4px;
    border-radius: 3px;
    opacity: 0.5;
  }
  .doc-row .del-doc:hover { opacity: 1; color: #ef4444; }
</style>
</head>
<body>

<header>
  <h1>📚 Knowledge Base AI</h1>
  <div class="actions">
    <button id="upload-toggle" onclick="toggleUpload()" title="Upload documents">＋</button>
    <button onclick="clearChat()">🗑 Clear</button>
    <button onclick="toggleTheme()" id="theme-btn">🌙 Dark</button>
  </div>
</header>

<div id="upload-panel">
  <div class="drop-zone" id="drop-zone">
    <span class="icon">📁</span>
    Drag & drop files here, or click to select
    <div class="hint">Supports PDF, Word, HTML, code, text · Max 10 files, 50MB each</div>
  </div>
  <input type="file" id="file-input" multiple style="display:none" accept=".pdf,.docx,.html,.htm,.txt,.md,.py,.js,.ts,.jsx,.tsx,.java,.cpp,.c,.h,.hpp,.go,.rs,.rb,.php,.swift,.kt,.scala,.sql,.sh,.bash,.m,.r,.css,.json,.xml,.yaml,.yml,.toml,.ini,.cfg">
  <div id="file-list"></div>
  <div class="upload-actions">
    <button id="upload-btn" onclick="doUpload()" disabled>Upload</button>
    <span class="upload-status" id="upload-status"></span>
  </div>
  <div id="doc-list"></div>
</div>

<div id="chat"></div>

<footer>
  <div id="status">Ready · Press Enter to send, Shift+Enter for new line</div>
  <div id="input-row">
    <textarea id="input" rows="1" placeholder="Ask anything from your knowledge base..."></textarea>
    <button id="send-btn" onclick="send()">Send</button>
  </div>
</footer>

<script>
// ---- 配置：部署时改这里 ----
const BASE = window.location.hostname === 'localhost'
  ? 'http://localhost:8000'
  : window.location.origin + '/api';
const API = BASE + '/ask';
const UPLOAD_API = BASE + '/upload';
const DOCS_API = BASE + '/documents';
const STATUS_API = BASE + '/upload/status';

const sessionId = 'session-' + Math.random().toString(36).slice(2, 10);
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const status = document.getElementById('status');

// ---- Upload ----
const uploadPanel = document.getElementById('upload-panel');
const uploadToggle = document.getElementById('upload-toggle');
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const fileList = document.getElementById('file-list');
const uploadBtn = document.getElementById('upload-btn');
const uploadStatus = document.getElementById('upload-status');
const docList = document.getElementById('doc-list');
let selectedFiles = [];
let statusPollTimer = null;

function initUpload() {
  // 页面加载 / 刷新时重置所有状态
  selectedFiles = [];
  fileInput.value = '';
  renderFileList();
  setStatus('', '');
  uploadPanel.classList.remove('show');
  uploadToggle.classList.remove('active');
  uploadToggle.textContent = '＋';
  if (statusPollTimer) { clearInterval(statusPollTimer); statusPollTimer = null; }
}
initUpload();

function toggleUpload() {
  const show = uploadPanel.classList.toggle('show');
  uploadToggle.classList.toggle('active', show);
  uploadToggle.textContent = show ? '✕' : '＋';
  if (show) {
    loadDocList();
  } else {
    // 关闭面板时停止轮询
    if (statusPollTimer) { clearInterval(statusPollTimer); statusPollTimer = null; }
  }
}

// Drag & drop
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  addFiles(e.dataTransfer.files);
});
dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => addFiles(fileInput.files));

function addFiles(files) {
  if (selectedFiles.length + files.length > 10) {
    setStatus('Max 10 files allowed', 'error');
    return;
  }
  for (const f of files) {
    if (f.size > 50 * 1024 * 1024) {
      setStatus(`${f.name} exceeds 50MB limit`, 'error');
      continue;
    }
    if (!selectedFiles.find(sf => sf.name === f.name && sf.size === f.size)) {
      selectedFiles.push(f);
    }
  }
  if (selectedFiles.length > 10) selectedFiles = selectedFiles.slice(0, 10);
  renderFileList();
}

function removeFile(idx) {
  selectedFiles.splice(idx, 1);
  renderFileList();
}

function renderFileList() {
  fileList.innerHTML = selectedFiles.map((f, i) =>
    `<span class="file-tag">
      <span class="name">${esc(f.name)}</span>
      <span class="size">${formatSize(f.size)}</span>
      <span class="remove" onclick="removeFile(${i})">×</span>
    </span>`
  ).join('');
  uploadBtn.disabled = selectedFiles.length === 0;
}

async function doUpload() {
  if (!selectedFiles.length) return;
  uploadBtn.disabled = true;
  setStatus('Saving files...', '');

  const form = new FormData();
  selectedFiles.forEach(f => form.append('files', f));

  try {
    const res = await fetch(UPLOAD_API, { method: 'POST', body: form });
    const data = await res.json();

    if (data.errors && data.errors.length) {
      setStatus(data.errors.join('; '), 'error');
    }
    if (data.success && data.success.length) {
      const names = data.success.map(f => f.name);
      setStatus(`${data.success.length} file(s) saved, indexing in background...`, 'success');
      selectedFiles = [];
      fileInput.value = '';
      renderFileList();
      loadDocList();
      pollStatus(names);
    }
  } catch (e) {
    setStatus('Cannot connect to server. Is the API running?', 'error');
  } finally {
    uploadBtn.disabled = selectedFiles.length === 0;
  }
}

function pollStatus(names) {
  if (statusPollTimer) clearInterval(statusPollTimer);
  const pending = new Set(names);
  let attempts = 0;

  statusPollTimer = setInterval(async () => {
    try {
      const res = await fetch(STATUS_API);
      const statuses = await res.json();
      let done = 0, errors = 0;

      for (const name of pending) {
        const st = statuses[name] || 'pending';
        if (st === 'done') done++;
        else if (st.startsWith('error')) errors++;
      }

      const remaining = pending.size - done - errors;
      if (remaining > 0) {
        setStatus(`Indexing... ${done} done, ${remaining} processing, ${errors} failed`, '');
      } else {
        clearInterval(statusPollTimer);
        statusPollTimer = null;
        if (errors > 0) {
          setStatus(`Indexing complete: ${done} ok, ${errors} failed`, 'error');
        } else {
          setStatus(`All ${done} file(s) indexed ✓`, 'success');
        }
        loadDocList();
      }
      attempts++;
      if (attempts > 60) {
        clearInterval(statusPollTimer);
        statusPollTimer = null;
        setStatus(`Indexing timed out — ${pending.size - done - errors} still processing`, 'error');
        loadDocList();
      }
    } catch (e) {
      // keep polling
    }
  }, 2000);
}

async function loadDocList() {
  try {
    const res = await fetch(DOCS_API);
    const data = await res.json();
    let statuses = {};
    try {
      const sr = await fetch(STATUS_API);
      statuses = await sr.json();
    } catch (e) {}

    docList.innerHTML = data.files && data.files.length
      ? data.files.map(f => {
          const st = statuses[f.name] || '';
          const badge = st === 'done' ? ' ✅' :
                        st.startsWith('error') ? ' ❌' :
                        st ? ' ⏳' : '';
          return `<div class="doc-row">
            <span>📄 ${esc(f.name)} <span style="opacity:0.5">(${formatSize(f.size)})</span>${badge}</span>
            <button class="del-doc" data-filename="${escAttr(f.name)}" title="Delete">🗑</button>
          </div>`;
        }).join('')
      : '<div class="doc-row" style="opacity:0.5">No documents yet</div>';
  } catch (e) {
    docList.innerHTML = '<div class="doc-row" style="opacity:0.5">Failed to load documents</div>';
  }
}

// 事件委托：删除按钮点击
docList.addEventListener('click', e => {
  const btn = e.target.closest('.del-doc');
  if (!btn) return;
  const filename = btn.getAttribute('data-filename');
  if (filename) deleteDoc(filename);
});

async function deleteDoc(filename) {
  if (statusPollTimer) return;
  try {
    await fetch(`${DOCS_API}/${encodeURIComponent(filename)}`, { method: 'DELETE' });
    loadDocList();
    setStatus(`Deleted: ${filename}`, 'success');
  } catch (e) {
    setStatus('Delete failed: ' + e.message, 'error');
  }
}

function setStatus(msg, cls) {
  uploadStatus.textContent = msg;
  uploadStatus.className = 'upload-status ' + (cls || '');
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escAttr(s) {
  return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ---- Send message ----
async function send() {
  const question = input.value.trim();
  if (!question) return;
  input.value = '';
  input.style.height = 'auto';

  // User bubble
  addBubble('user', question);
  scrollDown();

  // Loading bubble
  const loadId = addLoading();
  sendBtn.disabled = true;
  status.textContent = 'Searching knowledge base...';

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, session_id: sessionId, verbose: true }),
    });
    const data = await res.json();

    // Remove loading, add answer
    removeLoading(loadId);
    addBubble('assistant', data.answer, data.sources);
    status.textContent = 'Ready';
  } catch (e) {
    removeLoading(loadId);
    addBubble('assistant', '⚠️ Cannot connect to server. Please check that the API is running.');
    status.textContent = 'Error: ' + e.message;
  }
  sendBtn.disabled = false;
  scrollDown();
}

// ---- UI helpers ----
function addBubble(role, content, sources) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="bubble">${escapeHtml(content).replace(/\n/g, '<br>')}</div>`;

  if (sources && sources.length) {
    const det = document.createElement('details');
    det.className = 'sources';
    det.innerHTML = `<summary>📎 ${sources.length} source chunks</summary>`
      + sources.map((s, i) => `<div class="src">[${i+1}] ${escapeHtml(s)}</div>`).join('');
    div.appendChild(det);
  }

  chat.appendChild(div);
}

let loadCounter = 0;
function addLoading() {
  const id = 'load-' + (++loadCounter);
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = id;
  div.innerHTML = '<div class="bubble"><div class="dot-pulse"><span></span><span></span><span></span></div></div>';
  chat.appendChild(div);
  return id;
}

function removeLoading(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function clearChat() {
  chat.innerHTML = '';
  status.textContent = 'Chat cleared';
  fetch(`${BASE}/session/${sessionId}`, { method: 'DELETE' }).catch(() => {});
}

function scrollDown() {
  setTimeout(() => chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' }), 50);
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ---- Theme ----
let dark = false;
function toggleTheme() {
  dark = !dark;
  document.body.classList.toggle('dark', dark);
  document.getElementById('theme-btn').textContent = dark ? '☀️ Light' : '🌙 Dark';
}

// ---- Keyboard ----
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

// ---- Auto-resize textarea ----
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
</script>

</body>
</html>
