<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Knowledge Base Chat</title>
<style>
  :root {
    --bg: #f5f5f5;
    --card: #ffffff;
    --text: #1a1a1a;
    --sub: #888;
    --bubble-user: #e3f2fd;
    --bubble-ai: #ffffff;
    --border: #e0e0e0;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --source-bg: #f8f9fa;
  }
  .dark {
    --bg: #1a1a2e;
    --card: #16213e;
    --text: #e0e0e0;
    --sub: #999;
    --bubble-user: #1e3a5f;
    --bubble-ai: #16213e;
    --border: #2a2a4a;
    --accent: #60a5fa;
    --accent-hover: #93bbfd;
    --source-bg: #0f1b2d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  /* Header */
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header .actions { display: flex; gap: 8px; }
  header button {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
  }
  header button:hover { background: var(--border); }
  /* Chat area */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg {
    display: flex;
    flex-direction: column;
    max-width: 75%;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } }
  .msg.user { align-self: flex-end; }
  .msg.assistant { align-self: flex-start; }
  .msg .bubble {
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.6;
    font-size: 14px;
    word-wrap: break-word;
    border: 1px solid var(--border);
  }
  .msg.user .bubble { background: var(--bubble-user); border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--bubble-ai); border-bottom-left-radius: 4px; }
  .msg .meta { font-size: 11px; color: var(--sub); margin-top: 4px; padding: 0 8px; }
  .msg.user .meta { text-align: right; }
  /* Sources */
  .sources {
    margin-top: 8px;
    background: var(--source-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .sources summary {
    padding: 8px 12px;
    font-size: 12px;
    color: var(--accent);
    cursor: pointer;
    user-select: none;
  }
  .sources .src {
    padding: 8px 12px;
    font-size: 12px;
    color: var(--sub);
    border-top: 1px solid var(--border);
    max-height: 100px;
    overflow-y: auto;
    white-space: pre-wrap;
    font-family: monospace;
  }
  /* Input area */
  footer {
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    flex-shrink: 0;
  }
  #input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  #input-row textarea {
    flex: 1;
    resize: none;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    outline: none;
    min-height: 42px;
    max-height: 120px;
    line-height: 1.4;
  }
  #input-row textarea:focus { border-color: var(--accent); }
  #send-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
    height: 42px;
  }
  #send-btn:hover { background: var(--accent-hover); }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  /* Loading dots */
  .dot-pulse { display: flex; gap: 4px; padding: 4px 0; }
  .dot-pulse span {
    width: 6px; height: 6px;
    background: var(--sub);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
  .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }
  /* Status bar */
  #status {
    font-size: 11px;
    color: var(--sub);
    padding: 4px 0;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>📚 Knowledge Base AI</h1>
  <div class="actions">
    <button onclick="clearChat()">🗑 Clear</button>
    <button onclick="toggleTheme()" id="theme-btn">🌙 Dark</button>
  </div>
</header>

<div id="chat"></div>

<footer>
  <div id="status">Ready · Press Enter to send, Shift+Enter for new line</div>
  <div id="input-row">
    <textarea id="input" rows="1" placeholder="Ask anything from your knowledge base..."></textarea>
    <button id="send-btn" onclick="send()">Send</button>
  </div>
</footer>

<script>
const API = 'http://localhost:8000/ask';
const sessionId = 'session-' + Math.random().toString(36).slice(2, 10);
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const status = document.getElementById('status');

// ---- Send message ----
async function send() {
  const question = input.value.trim();
  if (!question) return;
  input.value = '';
  input.style.height = 'auto';

  // User bubble
  addBubble('user', question);
  scrollDown();

  // Loading bubble
  const loadId = addLoading();
  sendBtn.disabled = true;
  status.textContent = 'Searching knowledge base...';

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, session_id: sessionId, verbose: true }),
    });
    const data = await res.json();

    // Remove loading, add answer
    removeLoading(loadId);
    addBubble('assistant', data.answer, data.sources);
    status.textContent = 'Ready';
  } catch (e) {
    removeLoading(loadId);
    addBubble('assistant', '⚠️ Connection failed. Is the API running?\n\nStart it with: uvicorn api:app --port 8000');
    status.textContent = 'Error: ' + e.message;
  }
  sendBtn.disabled = false;
  scrollDown();
}

// ---- UI helpers ----
function addBubble(role, content, sources) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="bubble">${escapeHtml(content).replace(/\n/g, '<br>')}</div>`;

  if (sources && sources.length) {
    const det = document.createElement('details');
    det.className = 'sources';
    det.innerHTML = `<summary>📎 ${sources.length} source chunks</summary>`
      + sources.map((s, i) => `<div class="src">[${i+1}] ${escapeHtml(s)}</div>`).join('');
    div.appendChild(det);
  }

  chat.appendChild(div);
}

let loadCounter = 0;
function addLoading() {
  const id = 'load-' + (++loadCounter);
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = id;
  div.innerHTML = '<div class="bubble"><div class="dot-pulse"><span></span><span></span><span></span></div></div>';
  chat.appendChild(div);
  return id;
}

function removeLoading(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function clearChat() {
  chat.innerHTML = '';
  status.textContent = 'Chat cleared';
  fetch(`http://localhost:8000/session/${sessionId}`, { method: 'DELETE' }).catch(() => {});
}

function scrollDown() {
  setTimeout(() => chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' }), 50);
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ---- Theme ----
let dark = false;
function toggleTheme() {
  dark = !dark;
  document.body.classList.toggle('dark', dark);
  document.getElementById('theme-btn').textContent = dark ? '☀️ Light' : '🌙 Dark';
}

// ---- Keyboard ----
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

// ---- Auto-resize textarea ----
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
</script>

</body>
</html>
